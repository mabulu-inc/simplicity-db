services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Different from simplicity-auth (54320), simplicity-oidc (54321),
      # and schema-flow (54329) so all repos can run tests in parallel.
      - '54322:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10
